services:
  - type: web
    name: tokentrail-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -U pip && pip install .
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --max-requests 500 --max-requests-jitter 50 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
