<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ttGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ttGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hex -->
  <rect width="64" height="64" rx="16" fill="#0B0F17" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#ttGradient)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Flowing Telemetry Trail / Neural Nodes -->
  <g filter="url(#glowFilter)">
    <!-- Trail Path -->
    <path d="M16 44 L28 20 L38 36 L48 18" stroke="url(#ttGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Token Trace Pulses (Horizontal Telemetry Ray) -->
    <path d="M14 44 H22" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M42 18 H50" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Interconnected Nodes -->
    <circle cx="16" cy="44" r="3.5" fill="#10b981" />
    <circle cx="28" cy="20" r="4" fill="#34d399" />
    <circle cx="38" cy="36" r="3.5" fill="#38bdf8" />
    <circle cx="48" cy="18" r="4.5" fill="#06b6d4" />
    <circle cx="48" cy="18" r="2" fill="#ffffff" />
  </g>
</svg>