[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokentrail"
version = "0.1.0"
description = "Zero-overhead, fail-safe LLM observability Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Meet Ramani" }
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokentrail"]

[tool.hatch.build.targets.sdist]
include = ["src/tokentrail", "README.md", "LICENSE"]
