[project]
name = "backend"
version = "0.1.0"
description = "TokenTrail Observability Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.9.0",
    "sqlalchemy>=2.0.36",
    "tiktoken>=0.8.0",
    "tokentrail",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "openai>=1.50.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.uv.workspace]
members = ["sdk"]

[tool.uv.sources]
tokentrail = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = ".:sdk/src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov=sdk/src/tokentrail --cov-report=term-missing"
testpaths = ["tests", "sdk/tests"]
pythonpath = [".", "sdk/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
